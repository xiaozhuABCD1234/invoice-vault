[project]
name = "backend"
version = "0.1.0"
description = "发票管理系统后端（FastAPI + SQLite + SQLAlchemy 2）"
readme = "README.md"
authors = [
    { name = "xiaozhu", email = "xiaozhuABCD1234@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "argon2-cffi>=23.1",
    "PyJWT>=2.10",
    "openpyxl>=3.1",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
